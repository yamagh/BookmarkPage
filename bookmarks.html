<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500;1,9..144,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bookmark-app"></div>

  <!-- Dependency order matters: each classic script reads the globals the
       previous one defined. No ES modules / no import / no fetch, so this
       loads fine from file://. -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="bookmarks.js"></script>
  <script src="bookmark-utils.js"></script>
  <script src="toast-utils.js"></script>
  <script src="side-effects.js"></script>
  <script src="app.js"></script>
  <script src="main.js"></script>
</body>
</html>
