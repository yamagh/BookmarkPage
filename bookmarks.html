<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500;1,9..144,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="bookmark-app"></div>

  <!-- Dependency order matters: each classic script reads the globals the
       previous one defined. No ES modules / no import / no fetch, so this
       loads fine from file://. -->
   <script src="https://unpkg.com/vue@3.5.45/dist/vue.global.js"></script>
   <script>
     // Vue comes from a CDN: if it cannot be reached (offline, a blocked
     // network, a CDN outage) nothing else on this page can run, so say
     // that plainly instead of leaving a blank page — without Vue, main.js
     // cannot mount and #bookmark-app would just stay empty.
     if (!window.Vue) {
       document.getElementById('bookmark-app').innerHTML =
         '<div style="max-width:34rem;margin:15vh auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6">' +
         '<h1 style="font-size:1.25rem;margin:0 0 .5rem">Couldn\'t load Vue from the CDN</h1>' +
         '<p style="margin:0">This page loads the Vue framework from <code>unpkg.com</code>, which needs an internet connection. Check your connection and reload the page.</p>' +
         '</div>';
     }
   </script>
   <script src="bookmarks.js"></script>
   <script src="src/bookmark-utils.js"></script>
   <script src="src/tags.js"></script>
   <script src="src/tag-picker.js"></script>
   <script src="src/catalog.js"></script>
   <script src="src/overlay-manager.js"></script>
   <script src="src/toast-utils.js"></script>
   <script src="src/keyboard.js"></script>
   <script src="src/side-effects.js"></script>
   <script src="src/app.js"></script>
   <script src="src/main.js"></script>
</body>
</html>
