/* ============================================
   BOOKMARKS — Paper & Ink Minimal Redesign
   Concept: Clean journal-like aesthetic
   Type: Inter Tight (display/body/UI)
     ============================================ */

/* CSS Custom Properties — Light mode defaults */
:root {
  /* Backgrounds */
  --bg-base: #faf9f7;
  --bg-surface: #ffffff;
  --bg-card: #ffffff;

  /* Text hierarchy */
  --text-primary: #1a1a1a;
  --text-secondary: #5a5a5a;
  --text-tertiary: #9a9a9a;

  /* Accents — warm stone/brown */
  --accent: #b5651d;
  --accent-muted: rgba(181, 101, 29, 0.15);

  /* Hairline dividers */
  --hairline: rgba(26, 26, 26, 0.08);

  /* Transitions — smooth theme change on all colored elements */
  --transition: 200ms ease;

  /* Spacing */
  --space-xs: 6px;
  --space-s: 10px;
  --space-m: 16px;
  --space-l: 24px;
  --space-xl: 32px;
  --space-xxl: 56px;
}

/* Dark mode overrides */
[data-theme="dark"] {
  --bg-base: #141418;
  --bg-surface: #1a1a1e;
  --bg-card: #1e1e24;

  --text-primary: #e8e6e1;
  --text-secondary: #9a978f;
  --text-tertiary: #6b6960;

  --accent: #c97d3a;
  --accent-muted: rgba(201, 125, 58, 0.15);

  --hairline: rgba(232, 230, 225, 0.06);
}

/* Smooth theme transition on all colored elements */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  transition: background-color var(--transition), color var(--transition);
}

body {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  background-color: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  transition: background-color var(--transition), color var(--transition);
}

/* ============================================
   THEME TOGGLE — minimal icon button
    =========================================== */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  border-radius: 50%;
  transition: color var(--transition), background-color var(--transition);
  line-height: 1;
}

.theme-toggle:hover {
  color: var(--accent);
  background-color: var(--accent-muted);
}

/* ============================================
   TOP NAVIGATION BAR — centered, minimal pill search
    =========================================== */
.action-bar {
  position: sticky;
  top: var(--space-l);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: var(--space-s) var(--space-xl);
  margin: var(--space-xxl) auto var(--space-xl);
  max-width: 960px;
  gap: var(--space-m);
}

.action-center {
  width: 100%;
  max-width: 520px;
}

.action-query {
  display: flex;
  align-items: center;
  gap: var(--space-s);
  border-bottom: 1px solid var(--hairline);
  padding: var(--space-s) var(--space-xs);
  transition: border-color var(--transition);
}

.action-query:focus-within {
  border-color: var(--accent);
}

.icon-search {
  font-size: var(--space-m);
  opacity: 0.35;
  color: var(--text-tertiary);
  transition: color var(--transition), opacity var(--transition);
  user-select: none;
}

.action-query:focus-within .icon-search {
  opacity: 1;
  color: var(--accent);
}

.query {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: var(--space-m);
  font-weight: 500;
  background: none;
  border: none;
  color: var(--text-primary);
  width: 100%;
  outline: none;
  line-height: 1.4;
  transition: color var(--transition);
}

.query::placeholder {
  color: var(--text-tertiary);
  font-weight: 400;
}

/* ============================================
   TAG GROUPS — clean cards with hairline dividers
    =========================================== */
.tag-groups {
  max-width: 960px;
  margin: 0 auto var(--space-xxl);
  padding: 0 var(--space-m);
}

.tag-groups > ul {
  columns: var(--columns, 3) var(--column-gap, var(--space-l));
  list-style: none;
}

/* Each tag group = a clean card */
li.tag {
  background: var(--bg-card);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1),
    border-color var(--transition),
    background-color var(--transition);
  animation: cardReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  break-inside: avoid;
  margin-bottom: var(--space-l);
}

li.tag:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--hairline);
  border-color: var(--accent-muted);
}

/* Stagger the reveal animation per card */
@keyframes cardReveal {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Generate delay for cards — up to 8 */
li.tag:nth-child(1) { animation-delay: 0.05s; }
li.tag:nth-child(2) { animation-delay: 0.09s; }
li.tag:nth-child(3) { animation-delay: 0.13s; }
li.tag:nth-child(4) { animation-delay: 0.17s; }
li.tag:nth-child(5) { animation-delay: 0.21s; }
li.tag:nth-child(6) { animation-delay: 0.25s; }
li.tag:nth-child(7) { animation-delay: 0.29s; }
li.tag:nth-child(8) { animation-delay: 0.33s; }

/* ============================================
   TAG NAME — small caps, tracked out, subtle underline
    =========================================== */
.tag-name {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  font-variant: small-caps;
  letter-spacing: 0.1em;
  color: var(--accent);
  padding: var(--space-m) var(--space-l) var(--space-xs);
  position: relative;
  transition: color var(--transition);
}

.tag-name::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: var(--space-l);
  width: 20px;
  height: 1px;
  background: var(--accent);
  transition: background-color var(--transition);
}

/* ============================================
   BOOKMARK ITEMS — minimal links with chevron indicator
    =========================================== */
.tag-content ul {
  list-style: none;
  padding: var(--space-s) var(--space-l) var(--space-m);
}

li.item {
  padding: var(--space-xs) 0;
  border-bottom: 1px solid var(--hairline);
  transition: background-color var(--transition);
}

li.item:last-child {
  border-bottom: none;
}

li.item a {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  transition: color var(--transition), transform 0.2s ease;
  cursor: pointer;
}

/* Leading chevron indicator on hover — subtle shift */
li.item a::before {
  content: "›";
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 14px;
  opacity: 0;
  color: var(--accent);
  transform: translateX(-4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

li.item a:hover {
  color: var(--text-primary);
  transform: translateX(3px);
}

li.item a:hover::before {
  opacity: 1;
  transform: translateX(0);
}

/* Parameterized bookmarks get an indicator */
li.item[href*="%s"] a::after {
  content: "→";
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 11px;
  opacity: 0;
  color: var(--accent);
  margin-left: auto;
  transition: opacity 0.2s ease, transform 0.2s ease;
  transform: translateX(-4px);
}

li.item[href*="%s"]:hover a::after {
  opacity: 0.7;
  transform: translateX(0);
}

/* ============================================
   RESULT COUNTER & EMPTY STATES
    =========================================== */
.results-line {
  max-width: 960px;
  margin: 0 auto var(--space-l);
  padding: 0 var(--space-m);
  display: flex;
  align-items: baseline;
  gap: var(--space-s);
}

.results-count {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: var(--space-xxl);
  color: var(--accent);
  line-height: 1;
  transition: color var(--transition);
}

.results-label {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  color: var(--text-tertiary);
  transition: color var(--transition);
}

/* Empty state — minimal icon + muted text */
.empty-state {
  max-width: 960px;
  margin: var(--space-xxl) auto;
  padding: var(--space-xl) var(--space-m);
  text-align: center;
  animation: cardReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards;
}

.empty-icon {
  font-size: 40px;
  color: var(--text-tertiary);
  opacity: 0.5;
  margin-bottom: var(--space-m);
  transition: color var(--transition), opacity var(--transition);
}

.empty-text {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--text-tertiary);
  transition: color var(--transition);
}

/* Favicon icons on bookmark links */
.bm-favicon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.5;
  border-radius: 2px;
  transition: opacity 0.2s ease;
}

li.item:hover .bm-favicon {
  opacity: 1;
}

/* ============================================
   TOAST NOTIFICATION — theme-aware
    =========================================== */
.toast-notification {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  border: 1px solid var(--hairline);
  color: var(--accent);
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 8px;
  z-index: 99999;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1),
    background-color var(--transition),
    color var(--transition);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
}

[data-theme="dark"] .toast-notification {
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}

/* ============================================
   MANAGE BAR — add / download / reset controls
     ============================================ */
.manage-bar {
  max-width: 960px;
  margin: 0 auto var(--space-m);
  padding: 0 var(--space-m);
  display: flex;
  gap: var(--space-s);
  flex-wrap: wrap;
}

.manage-btn {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: none;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  transition: color var(--transition),
    background-color var(--transition),
    border-color var(--transition);
}

.manage-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background-color: var(--accent-muted);
}

.manage-btn--muted {
  color: var(--text-tertiary);
}

/* ============================================
   BOOKMARK NOTE — small muted line under the label
     ============================================ */
.bm-note {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.4;
  margin-top: 2px;
  max-width: 92%;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* Per-item edit / delete actions — revealed on hover */
li.item {
  position: relative;
}

.item-actions {
  position: absolute;
  top: var(--space-xs);
  right: 0;
  display: flex;
  gap: var(--space-xs);
  opacity: 0;
  transition: opacity var(--transition);
}

li.item:hover .item-actions {
  opacity: 1;
}

.item-action {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 13px;
  line-height: 1;
  color: var(--text-tertiary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color var(--transition), background-color var(--transition);
}

.item-action:hover {
  color: var(--accent);
  background-color: var(--accent-muted);
}

.item-action--danger:hover {
  color: #c0392b;
  background-color: rgba(192, 57, 43, 0.12);
}

/* ============================================
   EDITOR MODAL — add / edit a single bookmark
     ============================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100000;
  padding: var(--space-m);
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  width: 100%;
  max-width: 440px;
  padding: var(--space-l);
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
  transition: background-color var(--transition), color var(--transition);
}

[data-theme="dark"] .modal {
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
}

.modal-title {
  font-family: "DM Serif Display", serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--text-primary);
  margin-bottom: var(--space-l);
}

.modal-body {
  display: flex;
  flex-direction: column;
  gap: var(--space-m);
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}

.field-label {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.field-label em {
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  color: var(--text-tertiary);
}

.field-input {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-base);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: var(--space-s) var(--space-m);
  transition: border-color var(--transition), background-color var(--transition);
}

.field-input:focus {
  outline: none;
  border-color: var(--accent);
}

.field-textarea {
  resize: vertical;
  min-height: 72px;
  line-height: 1.5;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-s);
  margin-top: var(--space-l);
}

.modal-btn {
  font-family: "Inter Tight", system-ui, sans-serif;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 8px 18px;
  cursor: pointer;
  background: var(--bg-base);
  color: var(--text-secondary);
  transition: color var(--transition),
    background-color var(--transition),
    border-color var(--transition);
}

.modal-btn--muted:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.modal-btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.modal-btn--primary:hover {
  filter: brightness(1.08);
}

/* ============================================
   RESPONSIVE
    =========================================== */
@media (min-width: 1200px) {
   .tag-groups > ul { --columns: 4; }
}

@media (max-width: 768px) {
   .action-bar {
    padding: var(--space-s) var(--space-m);
   }

   .tag-groups > ul { --columns: 2; }
}

@media (max-width: 480px) {
   .tag-groups > ul { --columns: 1; }
}

</style>

/**
 * Bookmark utilities: normalization, grouping, and favicon resolution.
 */
window.BookmarkUtils = {
  normalizeBookmarks(bookmarks) {
    return bookmarks.map(bm => {
      if (typeof bm.keywords === 'string') bm.keywords = [bm.keywords];
      if (typeof bm.tags === 'string')     bm.tags = [bm.tags];
      if (bm.note == null) bm.note = '';
      return bm;
     });
   },

  cloneBookmarks(bookmarks) {
    return JSON.parse(JSON.stringify(bookmarks));
   },

  serializeBookmarks(bookmarks) {
    const asArray = v => Array.isArray(v) ? v
       : (typeof v === 'string' && v.trim()) ? [v]
       : [];
    const pad = '  ';
    const items = bookmarks.map(bm => {
      const field = (key, val) => `${pad}${pad}"${key}": ${JSON.stringify(val)}`;
      const lines = [
        field('label', bm.label || ''),
        field('url', bm.url || ''),
        field('tags', asArray(bm.tags)),
        field('keywords', asArray(bm.keywords))
       ];
      if (bm.note) lines.push(field('note', bm.note));
      return `${pad}{\n${lines.join(',\n')}\n${pad}}`;
      });
    return `const bookmarks = [\n${items.join(',\n')}\n];\n`;
    },
  groupBookmarksByTag(bookmarks) {
    const grouped = {};
    for (const bm of bookmarks) {
      for (const tag of bm.tags) {
        if (!grouped[tag]) grouped[tag] = [];
        grouped[tag].push(bm);
      }
    }
    return grouped;
  },

  faviconUrl(url) {
    try {
      const u = new URL(url.startsWith('http') ? url : `https://${url}`);
      return `https://t2.google.com/favicon?sz=16&domain=${u.hostname}`;
    } catch {
      return null;
    }
  }
};

    </script>
    <script>
/**
 * Toast notification utility.
 * Displays a brief, non-blocking message at the bottom-center of the viewport.
 * Uses CSS classes with design tokens for theme-aware styling.
 */
window.ToastUtils = {
  toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast-notification';
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.transform = 'translateX(-50%) translateY(0)';
     });
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(-50%) translateY(20px)';
      setTimeout(() => el.remove(), 400);
     }, 2200);
   }
};

    </script>
    <script>
/**
 * Navigation service: handles bookmark URL navigation, including `%s` placeholder resolution.
 */
window.NavigationService = {
  navigate(bookmark) {
    if (bookmark.url.includes('%s')) {
      this.promptForParameter(bookmark);
    } else {
      window.location.href = bookmark.url;
    }
  },

  promptForParameter(bookmark) {
    const value = prompt('Enter search term:', '');
    if (value) {
      window.location.href = bookmark.url.replace('%s', encodeURIComponent(value));
    }
  }
};

    </script>
    <script>
/**
 * Clipboard service: exports bookmarks as JSON to the clipboard.
 * Depends on window.ToastUtils (must be loaded before this script).
 */
window.ClipboardService = {
  copyBookmarksToClipboard(bookmarks) {
    const json = JSON.stringify(bookmarks, null, 2);
    navigator.clipboard.writeText(json)
      .then(() => window.ToastUtils.toast('Bookmarks copied'))
      .catch(() => {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = json;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        window.ToastUtils.toast('Bookmarks copied');
      });
  }
};

    </script>
    <script>
/**
 * Download service: writes a generated file to the user's machine via a
 * Blob + temporary <a download> element. Best-effort; notifies via ToastUtils.
 * Depends on window.ToastUtils (must be loaded before this script).
 */
window.DownloadService = {
  download(filename, content, mime) {
    try {
      const blob = new Blob([content], { type: mime || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      window.ToastUtils.toast(`Downloaded ${filename}`);
      } catch (e) {
        window.ToastUtils.toast('Download failed');
      }
    }
};

    </script>
    <script>
/**
 * Vue component definition for the bookmark manager.
 * Relies on window.BookmarkUtils, window.NavigationService,
 * window.ClipboardService, window.DownloadService, window.BookmarkStore —
 * all exposed as globals via script load order.
 */
window.AppComponent = {
  data() {
    return {
      query: '',
      theme: window.ThemeManager.get(),
      bookmarks: window.BookmarkStore.load(bookmarks),
      originalBookmarks: window.BookmarkUtils.normalizeBookmarks(
        window.BookmarkUtils.cloneBookmarks(bookmarks)
        ),
      // editor modal state
      showEditor: false,
      isNew: false,
      editingIndex: -1,
      editing: { label: '', url: '', tags: '', keywords: '', note: '' }
      };
   },

  computed: {
    filteredBookmarks() {
      const q = this.query.trim().toLowerCase();
      if (!q) return this.bookmarks;
      const parts = q.split(/\s+/);
      return this.bookmarks.filter(bm => {
        return parts.every(part =>
          bm.label.toLowerCase().includes(part) ||
          bm.tags.some(t => t.toLowerCase().includes(part)) ||
          bm.keywords.some(kw => kw.toLowerCase().includes(part))
           );
         });
     },

    sortedGroupedBookmarks() {
      const grouped = window.BookmarkUtils.groupBookmarksByTag(this.filteredBookmarks);
      const sorted = {};
      Object.keys(grouped)
        .sort((a, b) => a.localeCompare(b))
        .forEach(tag => { sorted[tag] = grouped[tag]; });
      return sorted;
     },

    totalCount() {
      return Object.values(this.sortedGroupedBookmarks)
         .flat().length;
     }
   },

  methods: {
    toggleTheme() {
      const next = this.theme === 'dark' ? 'light' : 'dark';
      this.theme = next;
      window.ThemeManager.set(next);
     },

    navigate(bookmark) {
      window.NavigationService.navigate(bookmark);
     },

    goToFirstBookmark() {
      const groups = Object.values(this.sortedGroupedBookmarks);
      if (groups[0]?.[0]) this.navigate(groups[0][0]);
     },

    focusQueryInput() {
      this.$refs.query?.focus();
     },

    copyBookmarksToClipboard() {
      window.ClipboardService.copyBookmarksToClipboard(this.bookmarks);
     },

    faviconUrl(url) {
      return window.BookmarkUtils.faviconUrl(url);
      },

    // --- editor: open modal for an existing bookmark, or a blank one to add ---
    openEdit(bookmark) {
      const index = bookmark ? this.bookmarks.indexOf(bookmark) : -1;
      this.isNew = !bookmark;
      this.editingIndex = index;
      this.editing = bookmark ? {
        label: bookmark.label || '',
        url: bookmark.url || '',
        tags: (bookmark.tags || []).join(', '),
        keywords: (bookmark.keywords || []).join(', '),
        note: bookmark.note || ''
         } : { label: '', url: '', tags: '', keywords: '', note: '' };
      this.showEditor = true;
      },

    closeEditor() {
      this.showEditor = false;
      },

    saveEdit() {
      const e = this.editing;
      const label = e.label.trim();
      const url = e.url.trim();
      if (!label || !url) {
        window.ToastUtils.toast('Label and URL are required');
        return;
        }
      const bm = {
        label,
        url,
        tags: this.toList(e.tags),
        keywords: this.toList(e.keywords),
        note: e.note.trim()
         };
      if (this.isNew) this.bookmarks.push(bm);
       else this.bookmarks.splice(this.editingIndex, 1, bm);
      this.showEditor = false;
      window.BookmarkStore.save(this.bookmarks);
      window.ToastUtils.toast(this.isNew ? 'Bookmark added' : 'Bookmark saved');
      },

    addBookmark() {
      this.openEdit(null);
      },

    deleteBookmark(bookmark) {
      const index = this.bookmarks.indexOf(bookmark);
      if (index < 0) return;
      if (!confirm(`Delete "${bookmark.label}"?`)) return;
      this.bookmarks.splice(index, 1);
      window.BookmarkStore.save(this.bookmarks);
      window.ToastUtils.toast('Bookmark deleted');
      },

    downloadBookmarks() {
      const content = window.BookmarkUtils.serializeBookmarks(this.bookmarks);
      window.DownloadService.download('bookmarks.js', content, 'text/javascript');
      },

    resetBookmarks() {
      if (!confirm('Reset to the original bookmarks.js? Your saved edits will be cleared.')) return;
      this.bookmarks = window.BookmarkUtils.cloneBookmarks(this.originalBookmarks);
      window.BookmarkStore.save(this.bookmarks);
      window.ToastUtils.toast('Reset to original');
      },

    toList(value) {
      return String(value || '').split(',').map(s => s.trim()).filter(Boolean);
      }
    },

  mounted() {
    this.focusQueryInput();
   },

  template: `
     <div class="app-root">

       <!-- Header -->
       <header class="action-bar">
          <button class="theme-toggle" :title="'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'" @click="toggleTheme">
             {{ theme === 'dark' ? '☀' : '☾' }}
          </button>
          <div class="action-center">
             <div class="action-query">
                 <div class="icon-search">⌕</div>
                 <input ref="query" v-model="query" @keydown.enter="goToFirstBookmark"
                     class="query" placeholder="Search bookmarks…" autocomplete="off" />
              </div>
          </div>
       </header>
       <div class="manage-bar">
           <button class="manage-btn" @click="addBookmark">+ New</button>
           <button class="manage-btn" @click="downloadBookmarks">↓ bookmarks.js</button>
           <button class="manage-btn manage-btn--muted" @click="resetBookmarks">Reset</button>
       </div>


       <!-- Results counter -->
       <div class="results-line" v-if="!!query">
          <span class="results-count">{{ totalCount }}</span>
          <span class="results-label">result{{ totalCount !== 1 ? 's' : '' }} for "{{ query }}"</span>
       </div>

       <!-- Empty: no bookmarks -->
       <div class="empty-state" v-if="!query && totalCount === 0">
          <div class="empty-icon">◇</div>
          <p class="empty-text">No bookmarks yet. Add some to get started.</p>
       </div>

       <!-- Empty: no results -->
       <div class="empty-state" v-else-if="!!query && totalCount === 0">
          <div class="empty-icon">◇</div>
          <p class="empty-text">Nothing matches. Try different keywords.</p>
       </div>

       <!-- Bookmark grid -->
       <div class="tag-groups" v-else>
          <ul>
             <li v-for="(group, tag) in sortedGroupedBookmarks" :key="tag" class="tag">
               <div class="tag-content">
                  <div class="tag-name">{{ tag }} — {{ group.length }}</div>
                  <ul>
                    <li v-for="bm in group" :key="bm.url" class="item">
                      <a :href="bm.url" @click.prevent="navigate(bm)">
                        <img v-if="faviconUrl(bm.url)" class="bm-favicon" :src="faviconUrl(bm.url)" alt="" loading="lazy" />
                        {{ bm.label }}
                      </a>
                      <p v-if="bm.note" class="bm-note">{{ bm.note }}</p>
                      <div class="item-actions">
                        <button class="item-action" title="Edit" @click="openEdit(bm)">✎</button>
                        <button class="item-action item-action--danger" title="Delete" @click="deleteBookmark(bm)">✕</button>
                      </div>
                    </li>
                  </ul>
               </div>
             </li>
          </ul>
       </div>


       <!-- Editor modal -->
       <div class="modal-overlay" v-if="showEditor" @click.self="closeEditor">
          <div class="modal" role="dialog" aria-modal="true" @click.stop>
            <h2 class="modal-title">{{ isNew ? 'New bookmark' : 'Edit bookmark' }}</h2>
            <div class="modal-body">
              <label class="field">
                <span class="field-label">Label</span>
                <input class="field-input" v-model="editing.label" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">URL</span>
                <input class="field-input" v-model="editing.url" placeholder="https://…   (%s = search term)" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">Tags <em>(comma separated)</em></span>
                <input class="field-input" v-model="editing.tags" placeholder="🧰 Tools, 🌍 Web" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">Keywords <em>(comma separated)</em></span>
                <input class="field-input" v-model="editing.keywords" placeholder="cg, chatgpt" autocomplete="off" />
              </label>
              <label class="field">
                <span class="field-label">Note</span>
                <textarea class="field-input field-textarea" v-model="editing.note" rows="3" placeholder="Optional note"></textarea>
              </label>
            </div>
            <div class="modal-actions">
              <button class="modal-btn modal-btn--muted" @click="closeEditor">Cancel</button>
              <button class="modal-btn modal-btn--primary" @click="saveEdit">Save</button>
            </div>
          </div>
       </div>

     </div>
   `
};

    </script>
    <script>
/**
 * Bootstrap: create the Vue application instance and mount it.
 * Depends on: Vue (CDN), window.AppComponent, global `bookmarks` array.
 *
 * Theme handling:
 * - Detect stored theme or system preference before render (see inline script in HTML)
 * - localStorage key: 'theme' ('light' | 'dark')
 */

// Expose theme helpers to component
window.ThemeManager = {
  get() {
    try {
      return localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {
      return 'light';
    }
  },
  set(theme) {
    try {
      localStorage.setItem('theme', theme);
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      /* ignore storage errors */
    }
  }
};

// Persist edits to localStorage (key 'bookmarks'); fall back to the file's
// global `bookmarks` array when nothing is stored. Mirrors ThemeManager's
// best-effort storage pattern.
window.BookmarkStore = {
  KEY: 'bookmarks',
  load(source) {
    let data = source;
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) data = parsed;
       }
     } catch (e) {
       /* fall back to the file source */
     }
    return window.BookmarkUtils.normalizeBookmarks(
       window.BookmarkUtils.cloneBookmarks(data)
     );
   },
  save(bookmarks) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(bookmarks));
     } catch (e) {
       /* ignore storage errors */
     }
   }
};

const app = Vue.createApp(window.AppComponent);

app.mount('#bookmark-app');

    </script>
</body>
